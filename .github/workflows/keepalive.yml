name: Garder Supabase actif
# Supabase (offre gratuite) met un projet en pause après une semaine sans activité.
# Ce petit appel, tous les 3 jours, lit une ligne de la base pour éviter la pause.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "https://jwyzdngeplgzjjrsheyu.supabase.co/rest/v1/titles?select=id&limit=1" \
            -H "apikey: sb_publishable_sE9KECLXNFFNGH-B8VsLSQ_uQTMfw-m"
